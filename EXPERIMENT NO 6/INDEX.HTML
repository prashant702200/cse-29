<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fetching API Data using useEffect in React</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #eef2f7;
      color: #172033;
    }

    button,
    input {
      font: inherit;
    }

    .page {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: 34px 0;
    }

    .hero {
      padding: 30px;
      border-radius: 8px;
      background: #172033;
      color: #fff;
    }

    .hero p {
      max-width: 760px;
      margin: 10px 0 0;
      color: #d9e2f1;
      line-height: 1.6;
    }

    h1,
    h2,
    h3,
    p {
      margin-top: 0;
    }

    h1 {
      margin-bottom: 8px;
      font-size: 34px;
    }

    .layout {
      display: grid;
      grid-template-columns: 0.95fr 1.25fr;
      gap: 22px;
      margin-top: 22px;
    }

    .panel {
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 12px 28px rgba(23, 32, 51, 0.09);
      padding: 24px;
    }

    .field {
      display: grid;
      gap: 7px;
      margin-bottom: 16px;
    }

    label {
      font-weight: 700;
    }

    input {
      width: 100%;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      padding: 12px;
      outline: none;
    }

    input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.16);
    }

    .error {
      min-height: 18px;
      color: #b91c1c;
      font-size: 14px;
    }

    .submit-button,
    .reload-button {
      border: 0;
      border-radius: 6px;
      background: #2563eb;
      color: #fff;
      padding: 12px 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .submit-button {
      width: 100%;
    }

    .reload-button {
      background: #172033;
    }

    .success {
      margin-top: 16px;
      border-radius: 6px;
      background: #dcfce7;
      color: #166534;
      padding: 12px;
      font-weight: 700;
    }

    .api-header {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
      margin-bottom: 18px;
    }

    .user-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .user-card {
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 16px;
      background: #f8fafc;
    }

    .user-card h3 {
      margin-bottom: 8px;
      font-size: 18px;
    }

    .user-card p {
      margin-bottom: 6px;
      color: #475569;
      overflow-wrap: anywhere;
    }

    .status {
      color: #475569;
      line-height: 1.5;
    }

    .theory {
      margin-top: 22px;
    }

    .theory ul,
    .theory ol {
      line-height: 1.7;
      padding-left: 22px;
    }

    @media (max-width: 820px) {
      .layout,
      .user-grid {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 28px;
      }

      .api-header {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useEffect, useState } = React;

    function App() {
      const [formData, setFormData] = useState({
        name: "",
        email: "",
        password: ""
      });
      const [errors, setErrors] = useState({});
      const [submittedUser, setSubmittedUser] = useState(null);
      const [users, setUsers] = useState([]);
      const [loading, setLoading] = useState(true);
      const [apiError, setApiError] = useState("");

      async function fetchUsers() {
        setLoading(true);
        setApiError("");

        try {
          const response = await fetch("https://jsonplaceholder.typicode.com/users");

          if (!response.ok) {
            throw new Error("Unable to fetch API data");
          }

          const data = await response.json();
          setUsers(data.slice(0, 6));
        } catch (error) {
          setApiError(error.message);
        } finally {
          setLoading(false);
        }
      }

      useEffect(() => {
        fetchUsers();
      }, []);

      function handleChange(event) {
        const { name, value } = event.target;

        setFormData(previousData => ({
          ...previousData,
          [name]: value
        }));

        setErrors(previousErrors => ({
          ...previousErrors,
          [name]: ""
        }));
      }

      function validateForm() {
        const newErrors = {};
        const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        if (!formData.name.trim()) {
          newErrors.name = "Name is required.";
        } else if (formData.name.trim().length < 3) {
          newErrors.name = "Name must be at least 3 characters.";
        }

        if (!formData.email.trim()) {
          newErrors.email = "Email is required.";
        } else if (!emailPattern.test(formData.email)) {
          newErrors.email = "Enter a valid email address.";
        }

        if (!formData.password) {
          newErrors.password = "Password is required.";
        } else if (formData.password.length < 6) {
          newErrors.password = "Password must be at least 6 characters.";
        }

        return newErrors;
      }

      function handleSubmit(event) {
        event.preventDefault();
        const validationErrors = validateForm();

        if (Object.keys(validationErrors).length > 0) {
          setErrors(validationErrors);
          setSubmittedUser(null);
          return;
        }

        setSubmittedUser(formData);
        setFormData({
          name: "",
          email: "",
          password: ""
        });
        setErrors({});
      }

      return (
        <main className="page">
          <section className="hero">
            <h1>Fetching API Data using useEffect in React</h1>
            <p>
              This experiment uses controlled components, useState, form validation,
              submit events, dynamic errors, and useEffect to fetch and display API data.
            </p>
          </section>

          <section className="layout">
            <div className="panel">
              <h2>Registration Form</h2>
              <form onSubmit={handleSubmit} noValidate>
                <div className="field">
                  <label htmlFor="name">Name</label>
                  <input
                    id="name"
                    name="name"
                    type="text"
                    value={formData.name}
                    onChange={handleChange}
                    placeholder="Enter your name"
                  />
                  <span className="error">{errors.name}</span>
                </div>

                <div className="field">
                  <label htmlFor="email">Email</label>
                  <input
                    id="email"
                    name="email"
                    type="email"
                    value={formData.email}
                    onChange={handleChange}
                    placeholder="Enter your email"
                  />
                  <span className="error">{errors.email}</span>
                </div>

                <div className="field">
                  <label htmlFor="password">Password</label>
                  <input
                    id="password"
                    name="password"
                    type="password"
                    value={formData.password}
                    onChange={handleChange}
                    placeholder="Enter your password"
                  />
                  <span className="error">{errors.password}</span>
                </div>

                <button className="submit-button" type="submit">Submit Form</button>
              </form>

              {submittedUser && (
                <div className="success">
                  Registration successful for {submittedUser.name}.
                </div>
              )}
            </div>

            <div className="panel">
              <div className="api-header">
                <div>
                  <h2>API Data</h2>
                  <p className="status">Data fetched from JSONPlaceholder users API using useEffect.</p>
                </div>
                <button className="reload-button" type="button" onClick={fetchUsers}>
                  Reload API
                </button>
              </div>

              {loading && <p className="status">Loading API data...</p>}
              {apiError && <p className="error">Error: {apiError}</p>}

              {!loading && !apiError && (
                <div className="user-grid">
                  {users.map(user => (
                    <article className="user-card" key={user.id}>
                      <h3>{user.name}</h3>
                      <p><strong>Email:</strong> {user.email}</p>
                      <p><strong>City:</strong> {user.address.city}</p>
                      <p><strong>Company:</strong> {user.company.name}</p>
                    </article>
                  ))}
                </div>
              )}
            </div>
          </section>

          <section className="panel theory">
            <h2>Procedure Covered</h2>
            <ol>
              <li>Create a React application inside index.html using React CDN.</li>
              <li>Import useState and useEffect from React.</li>
              <li>Create state variables for form inputs, errors, API data, and loading state.</li>
              <li>Design a registration form with name, email, and password fields.</li>
              <li>Validate user inputs and display dynamic error messages.</li>
              <li>Handle form submission events.</li>
              <li>Fetch API data using useEffect when the component loads.</li>
              <li>Display the API data in the component.</li>
            </ol>
          </section>
        </main>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
