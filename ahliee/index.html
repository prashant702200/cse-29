<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beautiful Heart Girl</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    font-family: 'Segoe UI', sans-serif;
    overflow: hidden;
  }.container { text-align: center; }

.girl { font-size: 80px; animation: float 3s ease-in-out infinite; }

.heart { position: relative; width: 100px; height: 90px; margin: 20px auto; animation: beat 1s infinite; }

.heart:before, .heart:after { content: ""; position: absolute; left: 50px; top: 0; width: 50px; height: 80px; background: red; border-radius: 50px 50px 0 0; transform: rotate(-45deg); transform-origin: 0 100%; }

.heart:after { left: 0; transform: rotate(45deg); transform-origin: 100% 100%; }

@keyframes beat { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.2); } }

@keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }

.text { font-size: 22px; color: #fff; margin-top: 10px; animation: fadeIn 3s ease-in-out infinite alternate; }

@keyframes fadeIn { from { opacity: 0.5; } to { opacity: 1; } }

.sparkle { position: absolute; width: 5px; height: 5px; background: white; border-radius: 50%; animation: sparkleAnim 2s linear infinite; }

@keyframes sparkleAnim { 0% { transform: translateY(0) scale(1); opacity: 1; } 100% { transform: translateY(-200px) scale(0); opacity: 0; } } </style>

</head>
<body><div class="container">
  <div class="girl">👧</div>
  <div class="heart"></div>
  <div class="text"> ARCHITAAAAA I 💖 YOU </div>
</div><script>
  function createSparkle() {
    const sparkle = document.createElement('div');
    sparkle.classList.add('sparkle');
    sparkle.style.left = Math.random() * window.innerWidth + 'px';
    sparkle.style.top = window.innerHeight + 'px';
    document.body.appendChild(sparkle);

    setTimeout(() => {
      sparkle.remove();
    }, 2000);
  }

  setInterval(createSparkle, 100);
</script></body>
</html>
